<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时尚资讯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; }
        .fashion-container { width: 100%; height: 100vh; }
        .fashion-container iframe { width: 100%; height: 100%; border: none; }
        .fashion-loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="fashion-container">
        <iframe id="fashionFrame" src="/fashion/output/skill_result.html" onload="hideLoading()"></iframe>
    </div>
    <div id="loading" class="fashion-loading">加载中...</div>
    <script>
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        setTimeout(() => {
            if (document.getElementById('loading').style.display !== 'none') {
                document.getElementById('loading').textContent = '暂无时尚资讯数据';
            }
        }, 5000);
    </script>
</body>
</html>
