<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionSelector Pro — 亚马逊服装智能选品</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-mark">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="28" height="28" rx="6" stroke="currentColor" stroke-width="2"/>
                        <path d="M10 12h12M10 16h8M10 20h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="24" cy="20" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M24 18.5v3l1.5.75" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-title">FashionSelector</span>
                    <span class="logo-subtitle">Pro Dashboard</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="feed">
                    <svg viewBox="0 0 20 20" fill="none"><path d="M3 4h14M3 10h14M3 16h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <span>信息流</span>
                </a>
                <a href="#" class="nav-item" data-section="products">
                    <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
                    <span>爆品推荐</span>
                </a>
                <a href="#" class="nav-item" data-section="elements">
                    <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="1"/><circle cx="16" cy="4" r="2" stroke="currentColor" stroke-width="1"/><circle cx="4" cy="16" r="2" stroke="currentColor" stroke-width="1"/><circle cx="16" cy="16" r="2" stroke="currentColor" stroke-width="1"/></svg>
                    <span>爆品元素</span>
                </a>
                <a href="#" class="nav-item" data-section="trends">
                    <svg viewBox="0 0 20 20" fill="none"><path d="M2 16l5-6 3 3 8-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 4h6v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>趋势追踪</span>
                </a>
                <a href="#" class="nav-item" data-section="alerts">
                    <svg viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 016 6c0 4 4 5 4 8H4c0-3 4-4 4-8a6 6 0 012-6z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="18" r="1" fill="currentColor"/></svg>
                    <span>避坑预警</span>
                    <span class="nav-badge">3</span>
                </a>
                <a href="#" class="nav-item" data-section="settings">
                    <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.5v3M10 15.5v3M3.5 10h3M13.5 10h3M5 5l2 2M13 13l2 2M15 5l-2 2M7 13l-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <span>推送设置</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="system-status">
                    <div class="status-dot"></div>
                    <span class="status-text">系统运行中</span>
                </div>
                <div class="last-update">上次更新: <span id="lastUpdateTime">--</span></div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <h1 class="page-title" id="pageTitle">每日信息流</h1>
                    <div class="breadcrumb">
                        <span>首页</span>
                        <span class="breadcrumb-sep">/</span>
                        <span class="breadcrumb-current" id="breadcrumbCurrent">信息流</span>
                    </div>
                </div>
                <div class="top-bar-right">
                    <div class="filter-group">
                        <select class="filter-select" id="categoryFilter">
                            <option value="all">全部品类</option>
                            <option value="menswear-business">男装商务休闲</option>
                            <option value="menswear-sport">男装休闲运动</option>
                            <option value="menswear-outdoor">男装工装登山</option>
                            <option value="womenswear-business">女装商务休闲</option>
                            <option value="womenswear-sport">女装休闲运动</option>
                            <option value="womenswear-outdoor">女装工装登山</option>
                        </select>
                        <select class="filter-select" id="heatFilter">
                            <option value="all">全部热度</option>
                            <option value="high">高热度</option>
                            <option value="medium">中热度</option>
                        </select>
                    </div>
                    <button class="btn-primary" id="refreshBtn">
                        <svg viewBox="0 0 16 16" fill="none"><path d="M14 8a6 6 0 11-1.76-4.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 2v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        刷新数据
                    </button>
                </div>
            </header>

            <section class="stats-bar" id="statsBar">
                <div class="stat-card">
                    <div class="stat-value" id="statHitCount">--</div>
                    <div class="stat-label">高潜力爆品</div>
                    <div class="stat-trend up">↑ 12%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statElementCount">--</div>
                    <div class="stat-label">核心爆品元素</div>
                    <div class="stat-trend up">↑ 5</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTrendMatch">--</div>
                    <div class="stat-label">平均趋势匹配度</div>
                    <div class="stat-trend up">↑ 8%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statMargin">--</div>
                    <div class="stat-label">平均预期毛利</div>
                    <div class="stat-trend neutral">-</div>
                </div>
            </section>

            <section class="content-feed" id="contentFeed">
                <div class="feed-tabs">
                    <button class="feed-tab active" data-tab="all">综合</button>
                    <button class="feed-tab" data-tab="trends">趋势</button>
                    <button class="feed-tab" data-tab="alerts">预警</button>
                    <button class="feed-tab" data-tab="supply">供应链</button>
                </div>

                <div class="feed-stream" id="feedStream">
                </div>
            </section>

            <section class="products-grid" id="productsGrid" style="display: none;">
                <div class="section-header">
                    <h2>高潜力爆品</h2>
                    <div class="view-toggle">
                        <button class="toggle-btn active" data-view="grid">
                            <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="10" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                        <button class="toggle-btn" data-view="list">
                            <svg viewBox="0 0 16 16" fill="none"><path d="M1 3h14M1 8h14M1 13h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                </div>
                <div class="product-cards" id="productCards">
                </div>
            </section>

            <section class="elements-section" id="elementsSection" style="display: none;">
                <div class="section-header">
                    <h2>Top 10 爆品元素</h2>
                    <span class="section-desc">基于标准化标签的频率统计</span>
                </div>
                <div class="elements-list" id="elementsList">
                </div>
                <div class="suggestions-block">
                    <h3>视觉差异化建议</h3>
                    <div class="suggestions-grid" id="suggestionsGrid">
                    </div>
                </div>
            </section>

            <section class="trends-section" id="trendsSection" style="display: none;">
                <div class="section-header">
                    <h2>趋势追踪</h2>
                    <span class="section-desc">站内外趋势联动分析</span>
                </div>
                <div class="trends-grid" id="trendsGrid">
                </div>
            </section>

            <section class="alerts-section" id="alertsSection" style="display: none;">
                <div class="section-header">
                    <h2>避坑预警</h2>
                    <span class="section-desc">基于可靠评论数据的高频痛点</span>
                </div>
                <div class="alerts-list" id="alertsList">
                </div>
            </section>

            <section class="settings-section" id="settingsSection" style="display: none;">
                <div class="section-header">
                    <h2>推送设置</h2>
                    <span class="section-desc">自定义推送偏好与独特性阈值</span>
                </div>
                <div class="settings-form">
                    <div class="form-group">
                        <label class="form-label">关注品类</label>
                        <div class="checkbox-group" id="categoryCheckboxes">
                            <label class="checkbox-item"><input type="checkbox" value="menswear" checked> 男装</label>
                            <label class="checkbox-item"><input type="checkbox" value="womenswear" checked> 女装</label>
                            <label class="checkbox-item"><input type="checkbox" value="business-casual" checked> 商务休闲</label>
                            <label class="checkbox-item"><input type="checkbox" value="casual-sport" checked> 休闲运动</label>
                            <label class="checkbox-item"><input type="checkbox" value="workwear-outdoor" checked> 工装登山</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">推送频率</label>
                        <select class="form-select" id="pushFrequency">
                            <option value="daily">每日推送</option>
                            <option value="weekly">每周推送</option>
                            <option value="manual">手动触发</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">推送渠道</label>
                        <div class="checkbox-group" id="channelCheckboxes">
                            <label class="checkbox-item"><input type="checkbox" value="skill" checked> 技能内消息</label>
                            <label class="checkbox-item"><input type="checkbox" value="email"> 邮件</label>
                            <label class="checkbox-item"><input type="checkbox" value="sms"> 短信</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">独特性系数阈值</label>
                        <div class="slider-group">
                            <input type="range" class="form-slider" id="uniquenessSlider" min="0" max="1" step="0.05" value="0.7">
                            <span class="slider-value" id="uniquenessValue">0.70</span>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn-primary" id="saveSettingsBtn">保存设置</button>
                        <button class="btn-secondary" id="manualPushBtn">立即推送</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="productModal">
            <div class="modal-header">
                <h3 id="modalTitle">商品详情</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <script src="scripts/data.js"></script>
    <script src="scripts/renderers.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
